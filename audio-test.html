<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#183f32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Basic audio test · Folio</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg?v=audio-1" type="image/svg+xml">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#242c27;background:#f7f6f2;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));line-height:1.6}main{max-width:620px;margin:0 auto}a{color:#183f32}h1{font-size:28px;line-height:1.2;margin:30px 0 14px}h2{font-size:18px;line-height:1.4;margin:22px 0 6px;overflow-wrap:anywhere}p{margin:12px 0}#track{color:#798177;font-size:14px}audio{display:block;width:100%;margin:24px 0}button{font:inherit;min-height:44px;padding:11px 16px;border:1px solid #dce2d3;border-radius:10px;background:#fffefa;color:#183f32;cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #819d60;outline-offset:3px}textarea{display:block;width:100%;margin-top:18px;padding:12px;font:12px/1.5 monospace;min-height:240px}#status{color:#798177;font-size:14px}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{color:#e8eee5;background:#141a17}a{color:#bed69d}button{color:#bed69d;border-color:#45563f;background:#202c23}#track,#status{color:#a9b5a2}}
  </style>
  <script type="module" src="./js/audio-test.js"></script>
</head>
<body>
  <main>
    <a href="./app.html#settings">← Back to Folio</a>
    <h1>Basic audio test</h1>
    <p>Use the Play control below, lock your phone, then pause and resume from the lock screen.</p>
    <h2 id="book" hidden></h2>
    <p id="track" hidden></p>
    <audio id="audio" controls crossorigin="anonymous" preload="metadata" hidden></audio>
    <p id="status" role="status">Opening the current audio file…</p>
    <button id="copy-report" type="button">Copy test report</button>
    <textarea id="report" readonly aria-label="Test report" spellcheck="false" hidden></textarea>
  </main>
</body>
</html>
